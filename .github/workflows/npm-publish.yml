# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

permissions:
  id-token: write # Required for NPM trusted publishing
  contents: read

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update NPM version
        run: npm version ${{ github.event.release.tag_name }} --no-git-tag-version

      - name: Make release
        run: npm run make
        id: makeRelease

      - name: Fail job if makeRelease failed
        if: steps.makeRelease.outcome == 'failure'
        run: exit 1
        id: check-build-status

      - name: Publish NPM package (regular)
        if: "!github.event.release.prerelease"
        run: npm publish

      - name: Publish NPM package (pre-release)
        if: "github.event.release.prerelease"
        run: npm publish --tag next

      - name: Publish to CDN Cloudflare R2
        uses: ryand56/r2-upload-action@v1.4
        with:
          r2-account-id: ${{ secrets.CDN_MAPTILER_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CDN_MAPTILER_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CDN_MAPTILER_SECRET_ACCESS_KEY }}
          r2-bucket: cdn-storage
          source-dir: dist
          destination-dir: maptiler-geocoding-control/${{ github.event.release.tag_name }}/
